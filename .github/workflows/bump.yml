name: bump

# Weekly: resolve latest upstream versions, open or update one PR on
# bump/versions, then build and smoke test that branch and comment the result
# on the PR. PRs opened with GITHUB_TOKEN never trigger build.yml themselves,
# so the verification happens here instead. Merging the PR is a normal push to
# main, which build.yml picks up and turns into a patch release.

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  bump:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.bump.outputs.changed }}
      pr: ${{ steps.pr.outputs.pull-request-number }}
    steps:
      - uses: actions/checkout@v5

      - name: bump versions
        id: bump
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/bump-versions.sh

      - name: open or update PR
        if: steps.bump.outputs.changed == 'true'
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: bump/versions
          delete-branch: true
          add-paths: Dockerfile
          labels: bump
          commit-message: "chore: bump pinned versions"
          author: Xaroth Brook <xaroth+github@xaroth.nl>
          committer: Xaroth Brook <xaroth+github@xaroth.nl>
          title: "chore: bump pinned versions"
          body: |
            ${{ steps.bump.outputs.table }}

            The build and smoke test result is posted as a comment below.
            Merging tags the next patch release.

  verify:
    needs: bump
    if: needs.bump.outputs.changed == 'true'
    uses: ./.github/workflows/build.yml
    with:
      ref: bump/versions

  report:
    needs: [bump, verify]
    if: always() && needs.bump.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: comment on PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ needs.bump.outputs.pr }}
          RESULT: ${{ needs.verify.result }}
          SIZE: ${{ needs.verify.outputs.size }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ "$RESULT" == success ]]; then
            body="Build and smoke test passed. Image size $SIZE. [Run]($RUN)"
          else
            body="Build or smoke test **$RESULT**. Do not merge. [Run]($RUN)"
          fi
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$body"
