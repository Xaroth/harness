name: bump

# Weekly: resolve latest upstream versions, open or update one PR on
# bump/versions. Merging the PR is a normal push to main, which build.yml
# picks up and turns into a patch release.
#
# With a GitHub App (vars.APP_ID + secrets.APP_PRIVATE_KEY, contents and
# pull-requests write) the PR is opened as the App and build.yml runs on it
# like any PR. Without one, PRs opened with GITHUB_TOKEN trigger nothing, so
# this workflow builds and smoke tests the branch itself and comments the
# result on the PR.

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  bump:
    runs-on: ubuntu-latest
    env:
      HAS_APP: ${{ secrets.APP_PRIVATE_KEY != '' && vars.APP_ID != '' }}
    outputs:
      changed: ${{ steps.bump.outputs.changed }}
      pr: ${{ steps.pr.outputs.pull-request-number }}
      has_app: ${{ env.HAS_APP }}
    steps:
      - uses: actions/checkout@v7

      - name: app token
        if: env.HAS_APP == 'true'
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: bump versions
        id: bump
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/bump-versions.sh

      - name: open or update PR
        if: steps.bump.outputs.changed == 'true'
        id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app.outputs.token || secrets.GITHUB_TOKEN }}
          branch: bump/versions
          delete-branch: true
          add-paths: Dockerfile
          labels: bump
          commit-message: "chore: bump pinned versions"
          author: Xaroth Brook <xaroth+github@xaroth.nl>
          committer: Xaroth Brook <xaroth+github@xaroth.nl>
          title: "chore: bump pinned versions"
          body: |
            ${{ steps.bump.outputs.table }}

            Merging tags the next patch release.

  # Fallback without an App: the PR gets no checks of its own.
  verify:
    needs: bump
    if: needs.bump.outputs.changed == 'true' && needs.bump.outputs.has_app != 'true'
    uses: ./.github/workflows/build.yml
    with:
      ref: bump/versions

  report:
    needs: [bump, verify]
    if: always() && needs.bump.outputs.changed == 'true' && needs.bump.outputs.has_app != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: comment on PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ needs.bump.outputs.pr }}
          RESULT: ${{ needs.verify.result }}
          SIZE: ${{ needs.verify.outputs.size }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ "$RESULT" == success ]]; then
            body="Build and smoke test passed. Image size $SIZE. [Run]($RUN)"
          else
            body="Build or smoke test **$RESULT**. Do not merge. [Run]($RUN)"
          fi
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$body"
