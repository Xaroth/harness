name: release

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      level:
        description: Version part to bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

jobs:
  tag:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       contains(github.event.pull_request.labels.*.name, 'bump'))
    runs-on: ubuntu-latest
    steps:
      # Tags pushed with GITHUB_TOKEN do not trigger other workflows. With
      # BUMP_TOKEN set, the push below triggers build.yml for the new tag.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.ref }}
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.BUMP_TOKEN || secrets.GITHUB_TOKEN }}

      - name: tag next version
        env:
          LEVEL: ${{ inputs.level || 'patch' }}
        run: |
          latest="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)"
          latest="${latest:-v0.0.0}"
          IFS=. read -r major minor patch <<<"${latest#v}"
          case "$LEVEL" in
            major) next="v$((major + 1)).0.0" ;;
            minor) next="v$major.$((minor + 1)).0" ;;
            patch) next="v$major.$minor.$((patch + 1))" ;;
            *) echo "bad level: $LEVEL" >&2; exit 1 ;;
          esac
          echo "$latest -> $next"
          git tag "$next"
          git push origin "$next"
          echo "Tagged $next (from $latest)" >> "$GITHUB_STEP_SUMMARY"
